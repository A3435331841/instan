DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 384
    NUMBER: 2
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 192
    NUMBER: 3
  TRAIN:
    DATASETS_NAME: [GOT10K_train_full]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 20000
  VAL:
    DATASETS_NAME: [GOT10K_official_val]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 3000

MODEL:
  PRETRAIN_FILE: "/data/training_headonly_v4_cont_20260825/checkpoints/train/odtrack/finetune_headonly_v4_cont/ODTrack_ep0004.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: CTR_POINT
    ADD_CLS_TOKEN: True
    ATTN_TYPE: concat
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BBOX_TASK: True
  # Previous head-only runs did not lift the distribution broadly.  A small
  # non-zero backbone LR lets spherical/domain evidence update representations
  # while keeping the proven v4 checkpoint as a conservative initialization.
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 3
  CE_WARM_EPOCH: 2
  BATCH_SIZE: 8
  NUM_WORKER: 10
  EPOCH: 6
  LR_DROP_EPOCH: 4
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.000003
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 2
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 6
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
  TEMPLATE_NUMBER: 3
  MEMORY_THRESHOLD: 1000
